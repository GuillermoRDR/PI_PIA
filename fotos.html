<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">

        <link href="css/fotos.css" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">

    <body>

        <button id="back" onclick="window.location.href='galeria.html'"> <img id="back" src="media/imagenes/back.png"></button>
      
        

       

        <div class="efecto">
         <h1 class="trivia">Fotografías</h1>
        </div>

        <div id="galeria">
            <input type="checkbox" id="fav">
            <label id="favt">Fotos favoritas</label>
            <br>
            <br>
            <br>
            <img src="media/imagenes/mini.jpg" alt="foto" id="foto" onclick="openf(this)">

        </div>

    <div id="extend">
        
        <img id="extendf" src="media/imagenes/photo.jpg" alt="foto ampliada">
        <button id="hide" onclick="closef()"><img src="media/imagenes/x.png" alt="X" id="x"></button>
        <button id="share"><img src="media/imagenes/share.png" alt="share" id="sharei"></button>
        <button id="favf"><img src="media/imagenes/star.png" alt="star" id="star"></button>
        <button id="delete"><img src="media/imagenes/trash.png" alt="trash" id="trash"></button>
    </div>

<script>

function openf(img) {
    document.getElementById('extend').classList.add('show');
}

function closef() {
    document.getElementById('extend').classList.remove('show');
}


</script>
       
        


    </body>

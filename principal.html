<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>¡BATEA!</title>

        <link href="css/principal.css" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
        <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    </head>

    <body>
       <button id="conf"  onclick="window.location.href='configuracion.html'"> <img id="conf" src="media/imagenes/Conf.png"></button>
       <button id="usu" onclick="window.location.href='usuario.html'">Usuario <img id="prof" src="media/imagenes/fedep.png"></button>

       <br>
       <img id="logo" src="media/imagenes/BASET.png" alt="bat">
        
       <button class="bottom" id="tri" onclick="window.location.href='trivias.html'">Trivia</button>
       <button class="bottom" id="gal" onclick="window.location.href='galeria.html'">Galería</button>
        <button id="esc" onclick="openf(this)">Escanea</button>
        <audio autoplay src="media/music/Principal.mp3" type="audio/mpeg" loop></audio>

        <div id="extend">
            <div id="arContainer"></div>
            <div id="arOverlay"></div>
            <button id="hide" onclick="closef()"><img src="media/imagenes/x.png" alt="X" id="x"></button>
            <h2 id="scanStatus">Escaneando...</h2>
        </div>


        <script>
            let sceneEl = null;
            const TOTAL_TARGETS = 3;

            function openf() {
                document.getElementById('extend').classList.add('show');
                document.getElementById('scanStatus').innerText = 'Escaneando...';

                sceneEl = document.createElement('a-scene');
                sceneEl.setAttribute('mindar-image', 'imageTargetSrc: targets.mind; uiLoading: no; uiScanning: no; uiError: no; autoStart: true;');
                sceneEl.setAttribute('color-space', 'sRGB');
                sceneEl.setAttribute('renderer', 'colorManagement: true, physicallyCorrectLights');
                sceneEl.setAttribute('vr-mode-ui', 'enabled: false');
                sceneEl.setAttribute('device-orientation-permission-ui', 'enabled: false');
                sceneEl.setAttribute('embedded', '');
                sceneEl.id = 'mindarScene';

                const camera = document.createElement('a-camera');
                camera.setAttribute('position', '0 0 0');
                camera.setAttribute('look-controls', 'enabled: false');
                sceneEl.appendChild(camera);

                for (let i = 0; i < TOTAL_TARGETS; i++) {
                    const target = document.createElement('a-entity');
                    target.setAttribute('mindar-image-target', `targetIndex: ${i}`);
                    target.id = `target${i}`;

                    target.addEventListener('targetFound', () => {
                        document.getElementById('scanStatus').innerText = `¡Imagen ${i + 1} detectada!`;
                        
                        setTimeout(() => {
                            window.location.href = `AR.html?target=${i}`;
                        }, 500);
                    });

                    sceneEl.appendChild(target);
                }
                
                document.getElementById('arContainer').appendChild(sceneEl);
                
                const interval = setInterval(() => {
                    const video = sceneEl.querySelector('video');
                    if (video) {
                        video.setAttribute('disablePictureInPicture', '');
                        video.setAttribute('controlsList', 'nofullscreen nodownload noremoteplayback');
                        video.style.pointerEvents = 'none';
                        clearInterval(interval);
                    }
                }, 100);
            }

            function closef() {
                document.getElementById('extend').classList.remove('show');

                if (sceneEl) {
                    sceneEl.parentNode.removeChild(sceneEl);
                    sceneEl = null;
                }
            }
        </script>
    </body>
</html>

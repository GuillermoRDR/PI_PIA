<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visualizador AR - Batea</title>

  <link href="css/ar.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/cb69cc3bd3.js" crossorigin="anonymous"></script>

  <script>
    // Permitir capturar el canvas WebGL.
    (function () {
      const originalGetContext =
        HTMLCanvasElement.prototype.getContext;

      HTMLCanvasElement.prototype.getContext =
        function (type, attrs) {
          if (
            type === 'webgl' ||
            type === 'webgl2' ||
            type === 'experimental-webgl'
          ) {
            attrs = Object.assign({}, attrs, {
              preserveDrawingBuffer: true
            });
          }

          return originalGetContext.call(this, type, attrs);
        };
    })();
  </script>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <script src="js/sceneAR.js" defer></script>
</head>

<body>

  <a-scene mindar-image="imageTargetSrc: /targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB" embedded renderer="colorManagement: true;" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false">
    </a-camera>

    <a-light type="ambient" intensity="1.5">
    </a-light>

    <a-light type="directional" position="1 2 3" intensity="1">
    </a-light>
    
    <a-entity id="ar-target-container"></a-entity>

  </a-scene>

  <canvas id="confettiCanvas"></canvas>

  <!-- Información del equipo -->
  <div id="extendfi">

    <button id="hidefi" onclick="closefi()">
      <img src="media/imagenes/x.png" alt="Cerrar" id="x2">
    </button>

    <div id="his">

      <h3 id="ar-equipo-nombre">
        Cargando equipo...
      </h3>

      <img id="ar-equipo-logo" alt="Logo del equipo">

      <h4>Historia del equipo</h4>
      <p id="ar-equipo-historia"></p>

      <h4>Descripción</h4>
      <p id="ar-equipo-descripcion"></p>

      <h4>Ciudad</h4>
      <p id="ar-equipo-ciudad"></p>

    </div>
  </div>

  <!-- Navegación -->
  <button id="usu" onclick="openfi()">
    Estadísticas e historia
  </button>

  <button id="back" onclick="window.location.href='principal.html'">
    <img id="back" src="media/imagenes/back.png" alt="Regresar">
  </button>

  <br>

  <button class="bottom" id="tri" onclick="window.location.href='trivias.html'">
    Trivia
  </button>

  <button class="bottom" id="gal" onclick="window.location.href='galeria.html'">
    Galería
  </button>

  <button class="bottomu" id="con" onclick="lanzarConfeti()">
    Confeti
  </button>

  <button class="bottomu" id="mov" type="button">
    Animar
  </button>

  <button id="esc" onclick="tomarFoto()">
    <i class="fa-solid fa-camera" style="color: white;">
    </i>
  </button>

  <audio autoplay src="media/music/Principal.mp3" type="audio/mpeg" loop>
  </audio>

  <!-- Panel de imagen ampliada -->
  <div id="extend">

    <img id="extendf" src="media/imagenes/scan.png" alt="Foto ampliada">

    <button id="hide" onclick="closef()">
      <img src="media/imagenes/x.png" alt="Cerrar" id="x">
    </button>

    <h2>Escaneando...</h2>
  </div>

  <!-- Captura de pantalla -->
  <div id="fotoOverlay">

    <button id="fotoCerrar" onclick="cerrarFoto()">
      ✕
    </button>

    <img id="fotoPreview" src="" alt="Captura de la pantalla AR">

    <p id="fotoAyuda">
      Mantén presionada la imagen para guardarla en tu galería
    </p>

    <div id="fotoBotones">
      <a id="fotoDescargar" href="#" download="batea-foto.png">
        Descargar
      </a>
    </div>

  </div>

</body>

</html>

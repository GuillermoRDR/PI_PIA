<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configuración</title>

    <link href="css/configuracion.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">

    <script src="js/configApp.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
</head>

<body>
    <button class="config-back-button" id="configBackButton" type="button" onclick="window.location.href='/principal'">

        <img class="config-back-icon" src="media/imagenes/back.png" alt="Regresar">

    </button>

    <h1 class="config-title">
        Configuración
    </h1>
    <section class="config-section">

        <h2 class="config-section-title">
            General
        </h2>


        <div class="config-option">

            <input class="config-checkbox" id="musicToggle" type="checkbox" checked>

            <label class="config-option-label" for="musicToggle">
                Música
            </label>

        </div>

        <div class="config-option">

            <input class="config-checkbox" id="sfxToggle" type="checkbox" checked>

            <label class="config-option-label" for="sfxToggle">
                Efectos de sonido
            </label>

        </div>


        <div class="config-option">

            <input class="config-checkbox" id="vibrationToggle" type="checkbox" checked>

            <label class="config-option-label" for="vibrationToggle">
                Vibración
            </label>

        </div>

    </section>

    <section class="config-section">

        <h2 class="config-section-title">
            Realidad Aumentada
        </h2>

        <div class="config-option">

            <input class="config-checkbox" id="particlesToggle" type="checkbox" checked>

            <label class="config-option-label" for="particlesToggle">
                Efectos de partículas
            </label>

        </div>

        <div class="config-option">

            <span class="config-option-label">
                Recalibrar AR
            </span>

            <button class="config-action-button" id="recalibrateArButton" type="button">
                Recalibrar
            </button>

        </div>

        <div class="config-option">

            <span class="config-option-label">
                Posición del modelo
            </span>

            <button class="config-action-button" id="recalibrateModelButton" type="button">
                Recalibrar
            </button>

        </div>

    </section>


    <section class="config-section config-account-section">

        <h2 class="config-section-title">
            Cuenta
        </h2>

        <div class="config-option config-logout-option">

            <span class="config-option-label">
                Cerrar sesión
            </span>

            <button class="config-logout-button" id="btnCS" type="button">
                Cerrar sesión
            </button>

        </div>

    </section>

    <footer class="config-footer">

        <span>Versión 1.2.0</span>

        <br>

        <span>Créditos:</span>

        <br>
        <br>

        <span>
            Guillermo René Dávila Roque. 2003063.
        </span>

        <br>

        <span>
            Juan Enrique Leal Gutiérrez. 1957848.
        </span>

    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de fotos</title>

  <link href="css/fotos.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
</head>

<body>

  <button id="back" onclick="window.location.href='galeria.html'">
    <img id="back" src="media/imagenes/back.png">
  </button>

  <div class="efecto">
    <h1 class="trivia">Fotografías</h1>
  </div>

  <div id="galeria">
    <input type="checkbox" id="fav">
    <label id="favt" for="fav">Fotos favoritas</label>

    <div id="lista" aria-live="polite"></div>
    <p id="vacio" class="oculto"></p>
  </div>

  <div id="extend">
    <img id="extendf" alt="foto ampliada">
    <button id="hide" type="button" aria-label="Cerrar"><img src="media/imagenes/x.png" alt="X" id="x"></button>
    <button id="share" type="button" aria-label="Compartir"><img src="media/imagenes/share.png" alt="share" id="sharei"></button>
    <button id="favf" type="button" aria-label="Marcar como favorita"><img src="media/imagenes/star.png" alt="star" id="star"></button>
    <button id="delete" type="button" aria-label="Eliminar"><img src="media/imagenes/trash.png" alt="trash" id="trash"></button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/alertas.js"></script>
  <script src="js/fotos.js"></script>
</body>

</html>

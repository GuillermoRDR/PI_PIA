<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de videos</title>

  <link href="css/videos.css?v=5" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
</head>

<body>
  <button id="back" onclick="window.location.href='galeria.html'">
    <img id="back" src="media/imagenes/back.png">
  </button>

  <div class="efecto">
    <h1 class="trivia">Videos</h1>
  </div>

  <div id="galeria">
    <input type="text" id="bus" placeholder="Buscar video por título" autocomplete="off" aria-label="Buscar video por título">
        <div id="lista-videos" aria-live="polite"></div>
    <p id="vacio-videos" class="oculto"></p>
  </div>

  <div id="extend">
    <div id="barra">
      <button id="hide" onclick="closef()"><img src="media/imagenes/x.png" alt="X" id="x"></button>
      <button id="filtros" onclick="alternarfi(event)">Filtros</button>
    </div>

    <div id="extendfi">
      <div id="lista">
        <button id="nof" class="filtro" data-f="">Sin filtro</button>
        <button id="des" class="filtro" data-f="des">Desenfoque</button>
        <button id="pix" class="filtro" data-f="pix">Pixelado</button>
        <button id="col" class="filtro" data-f="col">Colores pastel</button>
        <button id="ret" class="filtro" data-f="ret">Retro digital</button>
      </div>
    </div>

    <div id="zona">
      <div id="caja">
        <div id="escena">
          <video id="extendf" playsinline></video>
          <canvas id="extendc"></canvas>
        </div>
        <div id="ctrl">
          <button id="atras" class="cb" type="button" aria-label="Retroceder 10 segundos">-10s</button>
          <button id="pp" class="cb" type="button" aria-label="Reproducir o pausar">▶</button>
          <button id="adelante" class="cb" type="button" aria-label="Adelantar 10 segundos">+10s</button>
          <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Progreso">
          <span id="tiempo">0:00 / 0:00</span>
          <button id="vol" class="cb" type="button" aria-label="Silenciar o activar sonido">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9v6h4l5 4V5L7 9H3z" fill="white" />
              <g id="ondas">
                <path d="M15.5 9a4.5 4.5 0 0 1 0 6" />
                <path d="M18.5 6.5a8 8 0 0 1 0 11" />
              </g>
              <g id="cruz">
                <path d="M16 9l5 6M21 9l-5 6" />
              </g>
            </svg>
          </button>
          <input type="range" id="volrange" min="0" max="100" value="100" aria-label="Volumen">
          <button id="full" class="cb" type="button" aria-label="Pantalla completa">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const extend = document.getElementById('extend');
    const video = document.getElementById('extendf');
    const lienzo = document.getElementById('extendc');
    const cx = lienzo.getContext('2d');
    const chico = document.createElement('canvas');
    const cc = chico.getContext('2d', { willReadFrequently: true });
    const caja = document.getElementById('caja');
    const panel = document.getElementById('extendfi');
    const btnFiltros = document.getElementById('filtros');
    const pp = document.getElementById('pp');
    const atras = document.getElementById('atras');
    const adelante = document.getElementById('adelante');
    const full = document.getElementById('full');
    const vol = document.getElementById('vol');
    const volrange = document.getElementById('volrange');
    const ondas = document.getElementById('ondas');
    const cruz = document.getElementById('cruz');
    const seek = document.getElementById('seek');
    const tiempo = document.getElementById('tiempo');

    const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    const GAMEBOY = [[15, 56, 15], [48, 98, 48], [139, 172, 15], [155, 188, 15]];

    const escritorio = window.matchMedia('(min-width: 901px)');

    let filtro = null;
    let raf = 0;
    let panelAbierto = false;

    function openf(img) {
      aplicarFiltro(null);
      closefi();
      video.crossOrigin = 'anonymous';
      video.src = img.dataset.video;
      extend.classList.add('show');
    }

    function closef() {
      video.pause();
      video.removeAttribute('src');
      video.load();
      closefi();
      aplicarFiltro(null);
      if (document.fullscreenElement) document.exitFullscreen();
      extend.classList.remove('show');
    }

    function medirPanel() {
      if (!panelAbierto) return;
      const h = panel.scrollHeight;
      if (escritorio.matches) {
        panel.style.maxHeight = Math.min(h, window.innerHeight - 77) + 'px';
        extend.style.setProperty('--panel', '0px');
      } else {
        panel.style.maxHeight = h + 'px';
        extend.style.setProperty('--panel', (h + 8) + 'px');
      }
    }

    function openfi() {
      panelAbierto = true;
      panel.classList.add('showfi');
      medirPanel();
    }

    function closefi() {
      panelAbierto = false;
      panel.classList.remove('showfi');
      panel.style.maxHeight = '0px';
      extend.style.setProperty('--panel', '0px');
    }

    function alternarfi(e) {
      if (e) e.stopPropagation();
      if (panelAbierto) closefi();
      else openfi();
    }

    function ajustar() {
      const w = video.clientWidth;
      const h = video.clientHeight;
      if (!w || !h) return;

      const cambio = lienzo.width !== w || lienzo.height !== h;

      if (cambio) {
        lienzo.width = w;
        lienzo.height = h;
      }

      lienzo.style.width = w + 'px';
      lienzo.style.height = h + 'px';

      if (cambio && filtro) pintar();
    }

    function aplicarFiltro(f) {
      filtro = f;
      cancelAnimationFrame(raf);

      const activo = !!f;
      lienzo.classList.toggle('activo', activo);
      video.style.visibility = activo ? 'hidden' : 'visible';

      document.querySelectorAll('#extendfi .filtro').forEach(function (b) {
        b.classList.toggle('sel', b.dataset.f === (f || ''));
      });

      if (activo) {
        ajustar();
        dibujar();
      }
    }

    function dibujar() {
      if (!filtro) return;
      pintar();
      raf = requestAnimationFrame(dibujar);
    }

    function pintar() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;

      if (video.readyState >= 2 && vw && vh) {
        const W = lienzo.width;
        const H = lienzo.height;
        const k = Math.min(W / vw, H / vh);
        const dw = vw * k;
        const dh = vh * k;
        const dx = (W - dw) / 2;
        const dy = (H - dh) / 2;

        cx.globalCompositeOperation = 'source-over';
        cx.imageSmoothingEnabled = true;
        cx.fillStyle = '#000';
        cx.fillRect(0, 0, W, H);

        if (filtro === 'des') {
          cx.save();
          cx.beginPath();
          cx.rect(dx, dy, dw, dh);
          cx.clip();
          if ('filter' in cx) {
            const m = 28;
            cx.filter = 'blur(16px)';
            cx.drawImage(video, dx - m, dy - m, dw + 2 * m, dh + 2 * m);
          } else {
            const w = Math.max(8, Math.round(dw / 24));
            const h = Math.max(8, Math.round(dh / 24));
            chico.width = w;
            chico.height = h;
            cc.drawImage(video, 0, 0, w, h);
            cx.drawImage(chico, dx, dy, dw, dh);
          }
          cx.restore();
        }

        if (filtro === 'pix') {
          const cols = 44;
          const rows = Math.max(1, Math.round(cols * vh / vw));
          chico.width = cols;
          chico.height = rows;
          cc.drawImage(video, 0, 0, cols, rows);
          cx.imageSmoothingEnabled = false;
          cx.drawImage(chico, dx, dy, dw, dh);
        }

        if (filtro === 'col') {
          cx.drawImage(video, dx, dy, dw, dh);
          cx.globalCompositeOperation = 'saturation';
          cx.fillStyle = 'hsl(0, 20%, 50%)';
          cx.fillRect(dx, dy, dw, dh);
          cx.globalCompositeOperation = 'screen';
          cx.fillStyle = 'rgba(255, 205, 230, 0.45)';
          cx.fillRect(dx, dy, dw, dh);
          cx.globalCompositeOperation = 'source-over';
        }

        if (filtro === 'ret') {
          const cols = 160;
          const rows = Math.max(1, Math.round(cols * vh / vw));
          chico.width = cols;
          chico.height = rows;
          cc.drawImage(video, 0, 0, cols, rows);

          const img = cc.getImageData(0, 0, cols, rows);
          const d = img.data;

          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              const i = (y * cols + x) * 4;
              let g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
              g = (g - 128) * 1.25 + 128 + (BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.5) * 70;
              const c = GAMEBOY[Math.max(0, Math.min(3, Math.floor(g / 64)))];
              d[i] = c[0];
              d[i + 1] = c[1];
              d[i + 2] = c[2];
              d[i + 3] = 255;
            }
          }

          cc.putImageData(img, 0, 0);
          cx.imageSmoothingEnabled = false;
          cx.drawImage(chico, dx, dy, dw, dh);
        }
      }
    }

    function formato(s) {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60);
      const r = Math.floor(s % 60);
      return m + ':' + (r < 10 ? '0' : '') + r;
    }

    function actualizarTiempo() {
      if (video.duration) seek.value = (video.currentTime / video.duration) * 1000;
      else seek.value = 0;
      tiempo.textContent = formato(video.currentTime) + ' / ' + formato(video.duration);
    }

    function alternar() {
      if (video.paused) video.play();
      else video.pause();
    }

    function saltar(s) {
      const fin = isFinite(video.duration) ? video.duration : 0;
      video.currentTime = Math.max(0, Math.min(fin, video.currentTime + s));
    }

    function pantallaCompleta() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (caja.requestFullscreen) {
        caja.requestFullscreen();
      } else if (caja.webkitRequestFullscreen) {
        caja.webkitRequestFullscreen();
      }
    }

    function actualizarVolumen() {
      const mudo = video.muted || video.volume === 0;
      ondas.style.display = mudo ? 'none' : 'inline';
      cruz.style.display = mudo ? 'inline' : 'none';
      volrange.value = video.muted ? 0 : video.volume * 100;
    }

    document.querySelectorAll('#extendfi .filtro').forEach(function (b) {
      b.addEventListener('click', function () {
        aplicarFiltro(b.dataset.f || null);
        closefi();
      });
    });

    document.addEventListener('click', function (e) {
      if (panelAbierto && !panel.contains(e.target) && e.target !== btnFiltros) closefi();
    });

    pp.addEventListener('click', alternar);
    video.addEventListener('click', alternar);
    lienzo.addEventListener('click', alternar);
    atras.addEventListener('click', function () { saltar(-10); });
    adelante.addEventListener('click', function () { saltar(10); });
    full.addEventListener('click', pantallaCompleta);

    vol.addEventListener('click', function () {
      if (video.muted || video.volume === 0) {
        video.muted = false;
        if (video.volume === 0) video.volume = 0.5;
      } else {
        video.muted = true;
      }
    });

    volrange.addEventListener('input', function () {
      video.volume = volrange.value / 100;
      video.muted = video.volume === 0;
    });

    video.addEventListener('volumechange', actualizarVolumen);
    video.addEventListener('play', function () { pp.textContent = '❚❚'; });
    video.addEventListener('pause', function () { pp.textContent = '▶'; });
    video.addEventListener('timeupdate', actualizarTiempo);
    video.addEventListener('loadedmetadata', function () {
      actualizarTiempo();
      ajustar();
    });

    seek.addEventListener('input', function () {
      if (video.duration) video.currentTime = (seek.value / 1000) * video.duration;
    });

    document.addEventListener('fullscreenchange', function () {
      setTimeout(ajustar, 50);
    });
    window.addEventListener('resize', function () {
      ajustar();
      medirPanel();
    });
    escritorio.addEventListener('change', medirPanel);
    if (window.ResizeObserver) new ResizeObserver(ajustar).observe(video);

    actualizarVolumen();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/alertas.js"></script>
  <script src="js/videos.js"></script>
</body>

</html>
